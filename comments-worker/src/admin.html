<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Comment moderation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #faf9f6; --bg-subtle: #f1efe9; --text: #21201c; --text-muted: #6f6d66;
      --border: #e4e1d8; --accent: #b45309; --accent-tint: rgba(180, 83, 9, 0.09); --danger: #b91c1c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141517; --bg-subtle: #1d1f22; --text: #e8e6e1; --text-muted: #97948c;
        --border: #2a2c30; --accent: #2fbdb0; --accent-tint: rgba(47, 189, 176, 0.12); --danger: #f87171;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 400 0.95rem/1.6 "Inter", -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 46rem; margin: 0 auto; padding: 2.5rem 1rem 4rem; }
    h1 { font: 500 1.8rem/1.2 "Newsreader", Georgia, serif; margin: 0 0 1.5rem; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    input, textarea, button { font: inherit; color: inherit; }
    input, textarea {
      width: 100%; padding: 0.5rem; background: transparent;
      border: 1px solid var(--border); border-radius: 0;
    }
    input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    textarea { min-height: 5rem; resize: vertical; }
    button {
      cursor: pointer; padding: 0.4rem 0.9rem; font-size: 0.85rem; font-weight: 600;
      background: var(--bg-subtle); border: 1px solid var(--border);
    }
    button:hover { border-color: var(--accent); }
    button.danger { color: var(--danger); }
    button.link { background: none; border: none; padding: 0; font-weight: 500; color: var(--text-muted); }
    button.link:hover { color: var(--accent); }
    button:disabled { opacity: 0.5; cursor: default; }
    .row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .login { max-width: 22rem; display: grid; gap: 0.75rem; }
    .tabs { display: flex; gap: 1.25rem; border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
    .tabs button {
      background: none; border: none; border-bottom: 2px solid transparent; padding: 0.5rem 0;
      margin-bottom: -1px; color: var(--text-muted); font-size: 0.95rem;
    }
    .tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
    .card { border: 1px solid var(--border); padding: 1rem; margin-bottom: 0.75rem; }
    .meta { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 0.4rem; }
    .who { font-weight: 600; color: var(--text); }
    .badge {
      font-size: 0.7rem; font-weight: 600; padding: 0.05rem 0.35rem; margin-left: 0.3rem;
      background: var(--accent-tint); color: var(--accent);
    }
    .content { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0.25rem 0 0.75rem; }
    .reply { display: grid; gap: 0.5rem; margin-top: 0.75rem; }
    .empty, .msg { color: var(--text-muted); }
    .msg.error { color: var(--danger); }
    .top { display: flex; justify-content: space-between; align-items: baseline; }
    .badge.muted { background: var(--bg-subtle); color: var(--text-muted); }
    .badge.warn { background: rgba(185, 28, 28, 0.1); color: var(--danger); }
    .card.deleted { border-style: dashed; }
    .card.deleted .content { color: var(--text-muted); }
    .images { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0 0 0.75rem; }
    .image { position: relative; }
    .image img { display: block; max-width: 10rem; max-height: 8rem; border: 1px solid var(--border); }
    .image button {
      position: absolute; top: 0.25rem; right: 0.25rem; padding: 0.1rem 0.4rem;
      font-size: 0.75rem; background: var(--bg);
    }
    .gone {
      display: grid; place-items: center; width: 6rem; height: 4rem; font-size: 0.75rem;
      color: var(--text-muted); border: 1px dashed var(--border);
    }
    .history { margin-top: 0.75rem; border-top: 1px solid var(--border); padding-top: 0.75rem; }
    .history h3 { font-size: 0.85rem; font-weight: 600; margin: 0 0 0.5rem; }
    .revision { border-left: 2px solid var(--border); padding-left: 0.75rem; margin-bottom: 0.75rem; }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <h1>Comments</h1>
      <button class="link" id="logout" hidden>Sign out</button>
    </div>

    <form class="login" id="login" hidden>
      <label for="token">Admin token</label>
      <input id="token" type="password" autocomplete="current-password" required />
      <button type="submit">Sign in</button>
      <p class="msg error" id="login-msg"></p>
    </form>

    <section id="panel" hidden>
      <div class="tabs" role="tablist">
        <button role="tab" data-status="approved" aria-selected="true">Published <span id="n-approved"></span></button>
        <button role="tab" data-status="pending" aria-selected="false" id="tab-pending">Pending <span id="n-pending"></span></button>
      </div>
      <p class="msg" id="panel-msg"></p>
      <div id="list"></div>
    </section>
  </main>

  <script>
    const KEY = "comments-admin-token";
    let token = "";
    let status = "approved";
    const blobUrls = new Map(); // image id → object URL (images need the admin token)
    try { token = localStorage.getItem(KEY) || ""; } catch {}

    const $ = (id) => document.getElementById(id);

    async function api(path, options = {}) {
      const res = await fetch(path, {
        ...options,
        headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
      });
      if (res.status === 401) { signOut("That token didn't work."); throw new Error("unauthorized"); }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Request failed");
      return data;
    }

    function signOut(message) {
      token = "";
      try { localStorage.removeItem(KEY); } catch {}
      $("panel").hidden = true;
      $("logout").hidden = true;
      $("login").hidden = false;
      $("login-msg").textContent = message || "";
    }

    function el(tag, props = {}, children = []) {
      const node = Object.assign(document.createElement(tag), props);
      node.append(...children);
      return node;
    }

    function fmt(ms) {
      const d = new Date(ms);
      const p = (n) => String(n).padStart(2, "0");
      return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    // Admin image fetches carry the token, so they can show removed/deleted ones too.
    function imageEl(id, onRemove) {
      const box = el("div", { className: "image" });
      const img = el("img", { alt: "" });
      const link = el("a", { target: "_blank", rel: "noopener" }, [img]);
      box.append(link);
      const show = (url) => { img.src = url; link.href = url; };
      if (blobUrls.has(id)) show(blobUrls.get(id));
      else fetch(`/api/admin/images/${id}`, { headers: { Authorization: "Bearer " + token } })
        .then((res) => (res.ok ? res.blob() : Promise.reject()))
        .then((blob) => { const url = URL.createObjectURL(blob); blobUrls.set(id, url); show(url); })
        .catch(() => box.replaceWith(el("div", { className: "gone", textContent: "image removed" })));
      if (onRemove) {
        const remove = el("button", { className: "danger", textContent: "Remove", title: "Delete this image permanently" });
        remove.onclick = onRemove;
        box.append(remove);
      }
      return box;
    }

    const ACTIONS = { edit: "Edited", delete: "Deleted", restore: "Restored" };

    async function showHistory(c, node, button) {
      const open = node.querySelector(".history");
      if (open) { open.remove(); return; }
      button.disabled = true;
      try {
        const { revisions } = await api(`/api/admin/comments/${c.id}/history`);
        const panel = el("div", { className: "history" }, [
          el("h3", { textContent: "Earlier versions (newest first)" }),
        ]);
        revisions.forEach((r) => {
          const who = r.actor === "owner" ? "you" : "the commenter";
          panel.append(el("div", { className: "revision" }, [
            el("div", { className: "meta", textContent: `${ACTIONS[r.action] || r.action} by ${who} · ${fmt(r.created_at)} — before:` }),
            el("div", { className: "content", textContent: r.content || "(no text)" }),
            el("div", { className: "images" }, r.image_ids.map((id) => imageEl(id))),
          ]));
        });
        node.append(panel);
      } catch (err) {
        if (err.message !== "unauthorized") alert(err.message);
      } finally {
        button.disabled = false;
      }
    }

    function card(c) {
      const meta = el("div", { className: "meta" }, [el("span", { className: "who", textContent: c.nickname })]);
      if (c.by_owner) meta.append(el("span", { className: "badge", textContent: "Author" }));
      if (c.deleted_at) meta.append(el("span", { className: "badge warn", textContent: `Deleted by commenter ${fmt(c.deleted_at)}` }));
      if (c.edited_at) meta.append(el("span", { className: "badge muted", textContent: `Edited ${fmt(c.edited_at)}` }));
      if (c.email) meta.append(" · ", el("a", { href: "mailto:" + c.email, textContent: c.email }));
      meta.append(" · " + fmt(c.created_at));

      const where = el("div", { className: "meta" }, ["on "]);
      where.append(c.page_url
        ? el("a", { href: c.page_url, target: "_blank", rel: "noopener", textContent: c.page_title || c.page_id })
        : c.page_title || c.page_id);
      if (c.parent_nickname) where.append(" · replying to " + c.parent_nickname);

      const run = async (button, fn) => {
        button.disabled = true;
        try { await fn(); await load(); }
        catch (err) { if (err.message !== "unauthorized") { alert(err.message); button.disabled = false; } }
      };

      const text = el("div", { className: "content", textContent: c.content || "(no text)" });
      const images = el("div", { className: "images" }, c.images.map((id) => imageEl(id, (event) => {
        if (confirm("Permanently delete this image?")) {
          run(event.currentTarget, () => api(`/api/admin/images/${id}`, { method: "DELETE" }));
        }
      })));
      const actions = el("div", { className: "row" });
      const node = el("div", { className: "card" + (c.deleted_at ? " deleted" : "") }, [meta, where, text, images, actions]);

      const openEditor = (label, initial, submit) => {
        node.querySelector(".reply")?.remove();
        const box = el("textarea", { value: initial });
        const send = el("button", { textContent: label });
        send.onclick = () => run(send, () => submit(box.value));
        const cancel = el("button", { className: "link", textContent: "Cancel" });
        const form = el("div", { className: "reply" }, [box, el("div", { className: "row" }, [send, cancel])]);
        cancel.onclick = () => form.remove();
        actions.after(form);
        box.focus();
      };

      if (status === "pending") {
        const approve = el("button", { textContent: "Approve" });
        approve.onclick = () => run(approve, () => api(`/api/admin/comments/${c.id}/approve`, { method: "POST" }));
        actions.append(approve);
      }

      if (c.deleted_at) {
        const restore = el("button", { textContent: "Restore", title: "Undo the commenter's delete" });
        restore.onclick = () => run(restore, () => api(`/api/admin/comments/${c.id}/restore`, { method: "POST" }));
        actions.append(restore);
      } else {
        const reply = el("button", { textContent: status === "pending" ? "Approve & reply" : "Reply" });
        reply.onclick = () => openEditor("Post reply", "", (content) =>
          api(`/api/admin/comments/${c.id}/reply`, { method: "POST", body: JSON.stringify({ content }) }));
        const edit = el("button", { textContent: "Edit" });
        edit.onclick = () => openEditor("Save edit", c.content, (content) =>
          api(`/api/admin/comments/${c.id}/edit`, { method: "POST", body: JSON.stringify({ content }) }));
        actions.append(reply, edit);
      }

      if (c.revision_count) {
        const history = el("button", { textContent: `History (${c.revision_count})` });
        history.onclick = () => showHistory(c, node, history);
        actions.append(history);
      }

      const del = el("button", { className: "danger", textContent: "Delete" });
      del.title = "Delete permanently, with its replies, images and history";
      del.onclick = () => {
        if (confirm("Permanently delete this comment, its replies, images and history?")) {
          run(del, () => api(`/api/admin/comments/${c.id}`, { method: "DELETE" }));
        }
      };
      actions.append(del);

      return node;
    }

    async function load() {
      $("panel-msg").textContent = "Loading…";
      $("panel-msg").className = "msg";
      try {
        const data = await api("/api/admin/comments?status=" + status);
        $("login").hidden = true;
        $("panel").hidden = false;
        $("logout").hidden = false;
        $("n-pending").textContent = `(${data.counts.pending})`;
        $("n-approved").textContent = `(${data.counts.approved})`;
        // With auto-approve on, the queue only matters if it has leftovers.
        $("tab-pending").hidden = data.autoApprove && !data.counts.pending && status !== "pending";
        $("panel-msg").textContent = "";
        $("list").replaceChildren(...data.comments.map(card));
        if (!data.comments.length) {
          $("list").append(el("p", { className: "empty", textContent: status === "pending" ? "Nothing waiting for approval." : "No comments yet." }));
        }
      } catch (err) {
        if (err.message !== "unauthorized") {
          $("panel-msg").textContent = err.message;
          $("panel-msg").className = "msg error";
        }
      }
    }

    document.querySelectorAll(".tabs button").forEach((tab) => {
      tab.onclick = () => {
        status = tab.dataset.status;
        document.querySelectorAll(".tabs button").forEach((t) => t.setAttribute("aria-selected", t === tab));
        load();
      };
    });

    $("login").onsubmit = (e) => {
      e.preventDefault();
      token = $("token").value.trim();
      try { localStorage.setItem(KEY, token); } catch {}
      load();
    };
    $("logout").onclick = () => signOut();

    if (token) load(); else signOut();
  </script>
</body>
</html>
