<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Comment moderation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #faf9f6; --bg-subtle: #f1efe9; --text: #21201c; --text-muted: #6f6d66;
      --border: #e4e1d8; --accent: #b45309; --accent-tint: rgba(180, 83, 9, 0.09); --danger: #b91c1c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141517; --bg-subtle: #1d1f22; --text: #e8e6e1; --text-muted: #97948c;
        --border: #2a2c30; --accent: #2fbdb0; --accent-tint: rgba(47, 189, 176, 0.12); --danger: #f87171;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 400 0.95rem/1.6 "Inter", -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 46rem; margin: 0 auto; padding: 2.5rem 1rem 4rem; }
    h1 { font: 500 1.8rem/1.2 "Newsreader", Georgia, serif; margin: 0 0 1.5rem; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    input, textarea, button { font: inherit; color: inherit; }
    input, textarea {
      width: 100%; padding: 0.5rem; background: transparent;
      border: 1px solid var(--border); border-radius: 0;
    }
    input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    textarea { min-height: 5rem; resize: vertical; }
    button {
      cursor: pointer; padding: 0.4rem 0.9rem; font-size: 0.85rem; font-weight: 600;
      background: var(--bg-subtle); border: 1px solid var(--border);
    }
    button:hover { border-color: var(--accent); }
    button.danger { color: var(--danger); }
    button.link { background: none; border: none; padding: 0; font-weight: 500; color: var(--text-muted); }
    button.link:hover { color: var(--accent); }
    button:disabled { opacity: 0.5; cursor: default; }
    .row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .login { max-width: 22rem; display: grid; gap: 0.75rem; }
    .tabs { display: flex; gap: 1.25rem; border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
    .tabs button {
      background: none; border: none; border-bottom: 2px solid transparent; padding: 0.5rem 0;
      margin-bottom: -1px; color: var(--text-muted); font-size: 0.95rem;
    }
    .tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
    .card { border: 1px solid var(--border); padding: 1rem; margin-bottom: 0.75rem; }
    .meta { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 0.4rem; }
    .who { font-weight: 600; color: var(--text); }
    .badge {
      font-size: 0.7rem; font-weight: 600; padding: 0.05rem 0.35rem; margin-left: 0.3rem;
      background: var(--accent-tint); color: var(--accent);
    }
    .content { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0.25rem 0 0.75rem; }
    .reply { display: grid; gap: 0.5rem; margin-top: 0.75rem; }
    .empty, .msg { color: var(--text-muted); }
    .msg.error { color: var(--danger); }
    .top { display: flex; justify-content: space-between; align-items: baseline; }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <h1>Comments</h1>
      <button class="link" id="logout" hidden>Sign out</button>
    </div>

    <form class="login" id="login" hidden>
      <label for="token">Admin token</label>
      <input id="token" type="password" autocomplete="current-password" required />
      <button type="submit">Sign in</button>
      <p class="msg error" id="login-msg"></p>
    </form>

    <section id="panel" hidden>
      <div class="tabs" role="tablist">
        <button role="tab" data-status="approved" aria-selected="true">Published <span id="n-approved"></span></button>
        <button role="tab" data-status="pending" aria-selected="false" id="tab-pending">Pending <span id="n-pending"></span></button>
      </div>
      <p class="msg" id="panel-msg"></p>
      <div id="list"></div>
    </section>
  </main>

  <script>
    const KEY = "comments-admin-token";
    let token = "";
    let status = "approved";
    try { token = localStorage.getItem(KEY) || ""; } catch {}

    const $ = (id) => document.getElementById(id);

    async function api(path, options = {}) {
      const res = await fetch(path, {
        ...options,
        headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
      });
      const data = await res.json().catch(() => ({}));
      if (res.status === 401) { signOut("That token didn't work."); throw new Error("unauthorized"); }
      if (!res.ok) throw new Error(data.error || "Request failed");
      return data;
    }

    function signOut(message) {
      token = "";
      try { localStorage.removeItem(KEY); } catch {}
      $("panel").hidden = true;
      $("logout").hidden = true;
      $("login").hidden = false;
      $("login-msg").textContent = message || "";
    }

    function el(tag, props = {}, children = []) {
      const node = Object.assign(document.createElement(tag), props);
      node.append(...children);
      return node;
    }

    function fmt(ms) {
      const d = new Date(ms);
      const p = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    function card(c) {
      const who = el("span", { className: "who", textContent: c.nickname });
      const meta = el("div", { className: "meta" }, [who]);
      if (c.by_owner) meta.append(el("span", { className: "badge", textContent: "Author" }));
      if (c.email) meta.append(" · ", el("a", { href: "mailto:" + c.email, textContent: c.email }));
      meta.append(" · " + fmt(c.created_at));

      const where = el("div", { className: "meta" }, ["on "]);
      where.append(c.page_url
        ? el("a", { href: c.page_url, target: "_blank", rel: "noopener", textContent: c.page_title || c.page_id })
        : c.page_title || c.page_id);
      if (c.parent_nickname) where.append(" · replying to " + c.parent_nickname);

      const actions = el("div", { className: "row" });
      const node = el("div", { className: "card" }, [
        meta, where, el("div", { className: "content", textContent: c.content }), actions,
      ]);

      const run = async (button, fn) => {
        button.disabled = true;
        try { await fn(); await load(); }
        catch (err) { if (err.message !== "unauthorized") { alert(err.message); button.disabled = false; } }
      };

      if (status === "pending") {
        const approve = el("button", { textContent: "Approve" });
        approve.onclick = () => run(approve, () => api(`/api/admin/comments/${c.id}/approve`, { method: "POST" }));
        actions.append(approve);
      }

      const replyBtn = el("button", { textContent: status === "pending" ? "Approve & reply" : "Reply" });
      replyBtn.onclick = () => {
        if (node.querySelector(".reply")) return;
        const text = el("textarea", { placeholder: "Your reply" });
        const send = el("button", { textContent: "Post reply" });
        send.onclick = () => run(send, () => api(`/api/admin/comments/${c.id}/reply`, {
          method: "POST", body: JSON.stringify({ content: text.value }),
        }));
        node.append(el("div", { className: "reply" }, [text, el("div", { className: "row" }, [send])]));
        text.focus();
      };
      actions.append(replyBtn);

      const del = el("button", { className: "danger", textContent: "Delete" });
      del.onclick = () => {
        if (confirm("Delete this comment and any replies under it?")) {
          run(del, () => api(`/api/admin/comments/${c.id}`, { method: "DELETE" }));
        }
      };
      actions.append(del);

      return node;
    }

    async function load() {
      $("panel-msg").textContent = "Loading…";
      $("panel-msg").className = "msg";
      try {
        const data = await api("/api/admin/comments?status=" + status);
        $("login").hidden = true;
        $("panel").hidden = false;
        $("logout").hidden = false;
        $("n-pending").textContent = `(${data.counts.pending})`;
        $("n-approved").textContent = `(${data.counts.approved})`;
        // With auto-approve on, the queue only matters if it has leftovers.
        $("tab-pending").hidden = data.autoApprove && !data.counts.pending && status !== "pending";
        $("panel-msg").textContent = "";
        $("list").replaceChildren(...data.comments.map(card));
        if (!data.comments.length) {
          $("list").append(el("p", { className: "empty", textContent: status === "pending" ? "Nothing waiting for approval." : "No comments yet." }));
        }
      } catch (err) {
        if (err.message !== "unauthorized") {
          $("panel-msg").textContent = err.message;
          $("panel-msg").className = "msg error";
        }
      }
    }

    document.querySelectorAll(".tabs button").forEach((tab) => {
      tab.onclick = () => {
        status = tab.dataset.status;
        document.querySelectorAll(".tabs button").forEach((t) => t.setAttribute("aria-selected", t === tab));
        load();
      };
    });

    $("login").onsubmit = (e) => {
      e.preventDefault();
      token = $("token").value.trim();
      try { localStorage.setItem(KEY, token); } catch {}
      load();
    };
    $("logout").onclick = () => signOut();

    if (token) load(); else signOut();
  </script>
</body>
</html>
